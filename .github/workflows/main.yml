name: Build Marketplace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/spotify-1.3.3-compatibility

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.9.0
          runtime: node@24

      - name: Build Marketplace
        run: pnpm build:local

      - name: Package Marketplace
        run: |
          mkdir marketplace-dist
          cp -r dist/* marketplace-dist/
          zip -r marketplace.zip marketplace-dist

      - name: Upload Marketplace
        uses: actions/upload-artifact@v6
        with:
          name: marketplace
          path: marketplace.zip
