name: Build Marketplace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Marketplace
        run: pnpm build:local

      - name: Package Marketplace
        run: |
          mkdir marketplace-dist
          cp -r dist/* marketplace-dist/
          zip -r marketplace.zip marketplace-dist

      - name: Upload Marketplace
        uses: actions/upload-artifact@v6
        with:
          name: marketplace
          path: marketplace.zip
